[tool.ruff]
line-length = 100

[tool.ruff.format]
exclude = ["notebooks/*.ipynb"]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=70"
markers = [
    "postgres: requires a PostgreSQL database, optionally with pgvector",
]
