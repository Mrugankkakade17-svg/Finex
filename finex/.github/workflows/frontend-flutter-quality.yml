name: Flutter Quality Gates

on:
  push:
    paths:
      - "frontend_flutter/**"
      - ".github/workflows/frontend-flutter-quality.yml"
  pull_request:
    paths:
      - "frontend_flutter/**"
      - ".github/workflows/frontend-flutter-quality.yml"

permissions:
  contents: read

jobs:
  windows-quality:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run widget and service tests
        run: flutter test

      - name: Build Windows desktop client
        run: flutter build windows --debug
