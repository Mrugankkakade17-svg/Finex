name: R0-S2 Release Evidence

on:
  push:
    branches: ["feature/**", "release/**", "dev"]
  pull_request:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ".."
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Native dependencies
        run: python -m pip install -r requirements.txt
      - name: Create owned evidence directory outside the source checkout
        run: |
          set -euo pipefail
          evidence_directory="$RUNNER_TEMP/finex-r0-s2-evidence"
          mkdir -p "$evidence_directory"
          echo "FINEX_EVIDENCE_DIR=$evidence_directory" >> "$GITHUB_ENV"
      - name: Versioned data-quality gate
        run: python -m app.fixtures.s2_dat_01 --format json > "$FINEX_EVIDENCE_DIR/s2-data-quality.json"
      - name: Golden domain, HTTP and client-asset parity
        run: python verify_s2_risk.py --tested-sha "$GITHUB_SHA" > "$FINEX_EVIDENCE_DIR/s2-risk-evaluation.json"
      - name: Evaluation regressions and privacy
        run: >-
          python -m pytest tests/unit/test_s2_evaluation.py tests/contract/test_s2_risk_api.py
          tests/unit/test_cloud_ddl_configuration.py tests/integration/test_s1_s2_pilot_journey.py
          --no-cov --junitxml "$FINEX_EVIDENCE_DIR/s2-evaluation-tests.xml"
      - name: Owned saved-risk contract and fail-closed harness
        run: >-
          python -m pytest tests/contract/test_local_s2_risk_api.py
          tests/contract/test_local_s2_risk_transport.py tests/unit/test_s2_saved_risk_harness.py
          tests/unit/test_s2_saved_risk_ci.py --no-cov
      - name: Prove saved-risk native TCP, replay, ownership and two restarts
        run: |
          set -euo pipefail
          python verify_s2_saved_risk.py --report "$FINEX_EVIDENCE_DIR/s2-saved-risk-proof.json" --corpus "$FINEX_EVIDENCE_DIR/s2-saved-risk-corpus.json" --tested-sha "$GITHUB_SHA" --tested-tree "$(git rev-parse 'HEAD^{tree}')" --format json
      - name: Owned manual-portfolio contract and fail-closed native harness
        run: >-
          python -m pytest tests/contract/test_local_s2_portfolio_api.py
          tests/contract/test_local_s2_portfolio_transport.py
          tests/unit/test_local_s2_portfolio_native_harness.py
          tests/unit/test_local_s2_portfolio_ci.py --no-cov
      - name: Prove manual-portfolio native TCP, valuation, ownership and actual restarts
        run: |
          set -euo pipefail
          python verify_s2_manual_portfolio.py --report "$FINEX_EVIDENCE_DIR/s2-manual-portfolio-proof.json" --corpus "$FINEX_EVIDENCE_DIR/s2-manual-portfolio-corpus.json" --tested-sha "$GITHUB_SHA" --tested-tree "$(git rev-parse 'HEAD^{tree}')" --format json
      - name: Install checksum-pinned free Gitleaks CLI
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/finex-gitleaks-8.30.0"
          mkdir -p "$destination"
          curl --fail --silent --show-error --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o "$destination/tool.tar.gz"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $destination/tool.tar.gz" | sha256sum --check
          tar -xzf "$destination/tool.tar.gz" -C "$destination" gitleaks
          echo "FINEX_GITLEAKS=$destination/gitleaks" >> "$GITHUB_ENV"
      - name: Synthetic red probe and committed snapshot secret gate
        run: python verify_secret_snapshot.py --gitleaks "$FINEX_GITLEAKS" > "$FINEX_EVIDENCE_DIR/r0-secret-snapshot.json"
      - name: Provenance summary
        if: always()
        env:
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "## R0-S2 release evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "Tested checkout: $GITHUB_SHA; candidate head: $CANDIDATE_HEAD" >> "$GITHUB_STEP_SUMMARY"
          echo "Native, no cloud, no Docker. Secret scope: tracked snapshot, not Git history. No automatic branch promotion or cloud deployment." >> "$GITHUB_STEP_SUMMARY"
          for report in s2-data-quality.json s2-risk-evaluation.json s2-saved-risk-proof.json s2-manual-portfolio-proof.json r0-secret-snapshot.json; do
            if [ -f "$FINEX_EVIDENCE_DIR/$report" ]; then
              echo "### $report" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$FINEX_EVIDENCE_DIR/$report" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Retain safe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r0-s2-evidence-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/finex-r0-s2-evidence/s2-data-quality.json
            ${{ runner.temp }}/finex-r0-s2-evidence/s2-risk-evaluation.json
            ${{ runner.temp }}/finex-r0-s2-evidence/s2-saved-risk-proof.json
            ${{ runner.temp }}/finex-r0-s2-evidence/s2-saved-risk-corpus.json
            ${{ runner.temp }}/finex-r0-s2-evidence/s2-manual-portfolio-proof.json
            ${{ runner.temp }}/finex-r0-s2-evidence/s2-manual-portfolio-corpus.json
            ${{ runner.temp }}/finex-r0-s2-evidence/r0-secret-snapshot.json
            ${{ runner.temp }}/finex-r0-s2-evidence/s2-evaluation-tests.xml
